<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Email Header with Media — Ren10 Blocks</title>
  <meta name="description" content="A responsive Ren10 split header with an accessible email form and peer media panel.">
  <link rel="stylesheet" href="../../index.css">
  <link rel="stylesheet" href="../../components/index.css">
  <link rel="stylesheet" href="../../themes/appearance.css">
  <link rel="stylesheet" href="../../tokens/component/tokens.css">
  <link rel="stylesheet" href="../../site/shell.css">
  <style>
    .rh2-page {
      padding-block: var(--space-page-top) var(--space-page-bottom);
    }

    .rh2-hero {
      color: var(--color-text);
      background: var(--color-surface);
      border: var(--ren-card-border-width) solid var(--color-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .rh2-layout {
      --switcher-gap: var(--space-section-lg);
      --switcher-threshold: var(--width-7xl);
      align-items: center;
      padding: var(--space-section-lg);
    }

    .rh2-copy {
      --stack-gap: var(--space-stack-loose);
      min-width: 0;
    }

    .rh2-heading,
    .rh2-description,
    .rh2-terms,
    .rh2-media {
      margin: 0;
    }

    .rh2-heading {
      max-width: var(--width-prose);
      font-size: var(--display-lg-size);
      font-weight: var(--display-lg-weight);
      line-height: var(--display-lg-leading);
      letter-spacing: var(--display-lg-tracking);
      text-wrap: balance;
    }

    .rh2-description {
      max-width: var(--width-prose);
      color: var(--color-text-muted);
      font-size: var(--lead-size);
      font-weight: var(--lead-weight);
      line-height: var(--lead-leading);
    }

    .rh2-signup {
      --stack-gap: var(--space-stack-tight);
      width: min(100%, var(--width-sm));
    }

    .rh2-signup .ren-form {
      --stack-gap: var(--space-stack-tight);
    }

    .rh2-signup-row {
      --switcher-gap: var(--space-inline-tight);
      --switcher-threshold: var(--width-7xl);
      align-items: end;
    }

    .rh2-signup-row > ren-field,
    .rh2-signup-row > .rh2-cta {
      min-width: 100%;
    }

    .rh2-signup-row label {
      color: var(--color-text);
      font-size: var(--label-size);
      font-weight: var(--label-weight);
    }

    .rh2-signup-row .ren-input,
    .rh2-signup-row .rh2-cta {
      min-height: var(--touch-min);
    }

    .rh2-terms {
      color: var(--color-text-muted);
      font-size: var(--caption-size);
      line-height: var(--caption-leading);
    }

    .rh2-status {
      min-height: var(--body-leading);
      color: var(--color-success-strong);
      font-size: var(--body-sm-size);
      line-height: var(--body-sm-leading);
    }

    .rh2-media {
      min-width: 0;
      background:
        radial-gradient(circle at 75% 25%, var(--color-accent-hover), transparent 40%),
        linear-gradient(145deg, var(--color-accent-subtle), var(--color-accent));
      border: var(--ren-card-border-width) solid var(--color-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
    }

    @media (min-width: 48rem) {
      .rh2-layout > * {
        flex-basis: 0;
      }

      .rh2-signup-row > ren-field {
        flex: 1 1 auto;
        width: 0;
        min-width: 0;
      }

      .rh2-signup-row > .rh2-cta {
        flex: 0 0 auto;
        min-width: var(--touch-min);
      }
    }

    @media (max-width: 47.999rem) {
      .rh2-layout {
        --switcher-gap: var(--space-section-sm);
        padding: var(--space-section-sm) var(--space-card-padding-sm);
      }

      .rh2-heading {
        font-size: var(--display-md-size);
      }

      .rh2-media {
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body>
  <a href="#rh2-main" class="ren-link-skip">Skip to header example</a>

  <header class="dx-header">
    <div class="dx-container dx-header-inner">
      <a href="../../docs/index.html" class="dx-brand" aria-label="Ren10 documentation home">
        <span class="dx-brand-mark" aria-hidden="true">R</span>
        <span>Ren10</span>
      </a>
      <a href="index.html" class="ren-link ren-link-muted">All blocks</a>
    </div>
  </header>

  <main id="rh2-main" class="rh2-page ren-center ren-center-wide">
    <section class="rh2-hero" data-rh2-root aria-labelledby="rh2-heading">
      <div class="rh2-layout ren-switcher">
        <div class="rh2-copy ren-stack">
          <h1 id="rh2-heading" class="rh2-heading">Make space for your team’s best thinking</h1>
          <p class="rh2-description">A calm, shared workspace helps ideas move from a rough note to a decision everyone can follow.</p>

          <ren-form class="rh2-signup" data-validate="onSubmit">
            <form class="ren-form ren-stack" novalidate>
              <div class="ren-form-error-summary" role="alert" tabindex="-1" hidden>
                <strong>Please check your email address.</strong>
                <ul></ul>
              </div>

              <div class="rh2-signup-row ren-switcher">
                <ren-field data-rules="required|email">
                  <label for="rh2-email">Work email</label>
                  <input
                    id="rh2-email"
                    class="ren-input"
                    type="email"
                    name="email"
                    autocomplete="email"
                    placeholder="name@work.com"
                    required
                  >
                  <span data-error></span>
                </ren-field>
                <button class="ren-btn rh2-cta" type="submit">Join free</button>
              </div>

              <p class="rh2-terms">By continuing, you agree to our <a class="ren-link rh2-terms-link" href="../../LICENSE">terms of use</a>.</p>
              <p class="rh2-status" data-rh2-status role="status" aria-live="polite"></p>
            </form>
          </ren-form>
        </div>

        <figure class="rh2-media ren-frame ren-frame-photo">
          <img
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'%3E%3Cg opacity='.22'%3E%3Crect x='80' y='72' width='640' height='456' rx='40'/%3E%3C/g%3E%3Cg opacity='.42'%3E%3Ccircle cx='250' cy='230' r='72'/%3E%3Cpath d='M120 470 300 320l120 100 100-84 160 134z'/%3E%3C/g%3E%3C/svg%3E"
            alt="Abstract collaborative workspace illustration"
            width="800"
            height="600"
          >
        </figure>
      </div>
    </section>
  </main>

  <script type="module" src="../../components/primitives/ren-field/ren-field.js"></script>
  <script type="module" src="../../components/patterns/ren-form/ren-form.js"></script>
  <script type="module">
    const form = document.querySelector('[data-rh2-root] ren-form');
    const status = document.querySelector('[data-rh2-status]');
    const email = document.querySelector('#rh2-email');

    form?.addEventListener('ren-submit', (event) => {
      event.preventDefault();
      status.textContent = 'Thanks — check your inbox for the next step.';
      email.value = '';
    });
  </script>
</body>
</html>
