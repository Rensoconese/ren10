name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint + package + a11y + components + visual)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (Chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run lint

      - run: npm run test:theme

      - run: npm run test:evals

      - run: npm run test:detector

      - run: npm run agent:check

      - run: npm run test:exports

      - run: npm run smoke:cli-copy

      - run: npm run smoke:installed

      - run: npm run check:budgets

      - run: npm run test:budgets

      - run: npm run audit:runtime

      - run: npm run audit:full

      - run: npm run check:release

      - run: npm run check:supply-chain

      - run: npm run test:release-policy

      - run: npm run test:a11y

      - run: npm run test:components

      - run: npm run test:visual:linux

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          ASTRO_VERSION=$(node -p "require('./packages/astro/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi
          if [ "$ASTRO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG_VERSION) does not match @ren10/astro version $ASTRO_VERSION"
            exit 1
          fi

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Dry-run publish ren10
        run: npm publish --dry-run

      - name: Dry-run publish @ren10/astro
        run: npm publish --workspace @ren10/astro --dry-run

      - name: Publish ren10
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "ren10@$VERSION" version >/dev/null 2>&1; then
            echo "ren10@$VERSION is already published; skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ren10/astro
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@ren10/astro@$VERSION" version >/dev/null 2>&1; then
            echo "@ren10/astro@$VERSION is already published; skipping."
          else
            npm publish --workspace @ren10/astro --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract notes for this version from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section between [VERSION] and the next ## heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG section found for $VERSION"
            echo "See [CHANGELOG.md](./CHANGELOG.md)." > release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
