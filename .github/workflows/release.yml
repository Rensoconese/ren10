name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing verified release tag to resume (for example v0.14.2)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint + package + a11y + components + visual)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release tag input
        run: node -e "if (!/^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG)) process.exit(1)"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (Chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run lint

      - name: Confirm native Linux x64
        run: node -e "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1); console.log(process.platform, process.arch)"

      - run: npm run test:portable

      - run: npm run test:theme

      - run: npm run test:audit-regressions

      - run: npm run test:astro-local-install

      - run: npm run test:evals

      - run: npm run test:detector

      - run: npm run agent:check

      - run: npm run test:exports

      - run: npm run smoke:cli-copy

      - run: npm run smoke:installed

      - run: npm run check:budgets

      - run: npm run test:budgets

      - run: npm run audit:runtime

      - run: npm run audit:full

      - run: npm run check:release

      - run: npm run check:supply-chain

      - run: npm run test:release-policy

      - run: npm run test:a11y

      - run: npm run test:components

      - run: npm run test:visual:linux

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          ASTRO_VERSION=$(node -p "require('./packages/astro/package.json').version")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG (=$TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi
          if [ "$ASTRO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG (=$TAG_VERSION) does not match @ren10/astro version $ASTRO_VERSION"
            exit 1
          fi

  publish:
    name: Stage and confirm npm publication
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install pinned npm staging CLI
        run: npm install --global --ignore-scripts npm@11.21.0

      - run: npm ci

      - name: Verify trusted publisher release context
        run: node scripts/check-publish-access.mjs --oidc

      - name: Dry-run publish ren10
        run: npm publish --dry-run

      - name: Dry-run publish @ren10/astro
        run: npm publish --workspace @ren10/astro --dry-run

      - name: Stage exact verified tarballs with provenance
        run: node scripts/stage-release.mjs --oidc

      - name: Confirm both 2FA-approved versions are public
        run: node scripts/check-published-release.mjs --expected release-candidate.json --wait-seconds 1800

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Extract notes for this version from CHANGELOG
        id: notes
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Extract the section between [VERSION] and the next ## heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG section found for $VERSION"
            echo "See [CHANGELOG.md](./CHANGELOG.md)." > release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
