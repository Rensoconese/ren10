name: Scheduled RenDS audit
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run snapshots:check
      - run: npm run check:public-contracts
      - if: matrix.browser == 'chromium'
        run: npm run smoke:installed
      - if: matrix.browser == 'chromium'
        run: npm run check:budgets
      - if: matrix.browser == 'chromium'
        run: npm run test:budgets
      - if: matrix.browser == 'chromium'
        run: npm run audit:runtime
      - if: matrix.browser == 'chromium'
        run: npm run audit:full
      - if: matrix.browser == 'chromium'
        run: npm run check:release
      - if: matrix.browser == 'chromium'
        run: npm run check:supply-chain
      - if: matrix.browser == 'chromium'
        run: npm run test:release-policy
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:a11y
        env: { PLAYWRIGHT_BROWSER: "${{ matrix.browser }}" }
      - if: matrix.browser == 'chromium'
        run: npm run test:visual:linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-rends-audit-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 30
