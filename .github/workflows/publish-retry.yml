name: Publish retry

on:
  push:
    tags:
      - "publish-v*.*.*"

permissions:
  contents: read
  actions: write

jobs:
  publish-astro:
    name: Dispatch verified release recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Dispatch the same trusted release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/astro/package.json').version")
          test "$GITHUB_REF_NAME" = "publish-v$VERSION"
          git rev-parse --verify "refs/tags/v$VERSION"
          gh workflow run release.yml --repo Rensoconese/ren10 --ref main --field "release_tag=v$VERSION"
