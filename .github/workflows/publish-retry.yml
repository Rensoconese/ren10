name: Publish retry

on:
  push:
    tags:
      - "publish-v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish-astro:
    name: Stage and confirm verified release retry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install pinned npm staging CLI
        run: npm install --global --ignore-scripts npm@11.21.0

      - run: npm ci

      - name: Confirm the release was already verified
        run: |
          VERSION=$(node -p "require('./packages/astro/package.json').version")
          VERIFIED_SHA=$(git rev-list -n 1 "v$VERSION")
          git merge-base --is-ancestor "$VERIFIED_SHA" HEAD
          npm view "ren10@$VERSION" version

      - name: Dry-run publish @ren10/astro
        run: npm publish --workspace @ren10/astro --dry-run

      - name: Verify scoped npm publishing prerequisites
        run: node scripts/check-publish-access.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Stage exact verified tarballs with provenance
        run: node scripts/stage-release.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm both 2FA-approved versions are public
        run: node scripts/check-published-release.mjs --expected release-candidate.json --wait-seconds 1800

      - name: Extract release notes
        id: release
        run: |
          VERSION=$(node -p "require('./packages/astro/package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
