name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages requires id-token to mint the OIDC token used by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; queue subsequent pushes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6
        # Note: the very first deploy requires the maintainer to flip
        # Settings → Pages → Source to "GitHub Actions" by hand.
        # configure-pages has an `enablement: true` option for this, but
        # the default GITHUB_TOKEN doesn't carry admin rights on the
        # Pages REST API ("Resource not accessible by integration"),
        # so the auto-bootstrap path fails. Leaving the toggle as a
        # one-time human step.

      # Whitelist the files that make up the public site. Everything else
      # in the repo (tests/, scripts/, cli/, evals/, package.json,
      # node_modules, README) stays out of the artifact — keeps the
      # artifact small and the deployed surface to "the site, not the repo".
      #
      # Note: the package working tree IS the repo root (no `rends/`
      # prefix on the runner). Locally Renso runs from ~/RenDS/rends/
      # but that "rends/" is the repo checkout itself.
      - name: Assemble site root
        run: |
          set -e
          mkdir -p _site
          cp    index.html       _site/
          cp    index.css        _site/
          cp    ren-design.md    _site/
          cp -r tokens           _site/
          cp -r base             _site/
          cp -r components       _site/
          cp -r utils            _site/
          cp -r themes           _site/
          cp -r site             _site/
          cp -r docs             _site/
          cp -r templates        _site/
          cp -r create           _site/
          cp -r examples         _site/
          # 404 page so wrong URLs land somewhere readable.
          if [ -f docs/index.html ]; then
            cp docs/index.html _site/404.html || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
