name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages requires id-token to mint the OIDC token used by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; queue subsequent pushes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Whitelist the files that make up the public site. Everything else
      # in the repo (tests/, scripts/, cli/, evals/, package.json,
      # node_modules, README) stays out of the artifact even though it's
      # already public on GitHub — keeps the artifact small and the
      # deployed surface to "the site, not the repo".
      - name: Assemble site root from rends/
        run: |
          set -e
          mkdir -p _site
          cp    rends/index.html       _site/
          cp    rends/index.css        _site/
          cp    rends/ren-design.md    _site/
          cp -r rends/tokens           _site/
          cp -r rends/base             _site/
          cp -r rends/components       _site/
          cp -r rends/utils            _site/
          cp -r rends/themes           _site/
          cp -r rends/site             _site/
          cp -r rends/docs             _site/
          cp -r rends/templates        _site/
          cp -r rends/create           _site/
          cp -r rends/examples         _site/
          # 404 page so wrong URLs land somewhere readable.
          if [ -f rends/docs/index.html ]; then
            cp rends/docs/index.html _site/404.html || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
