name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs on the same PR / branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Browser matrix policy:
#   - lint runs once (no browser).
#   - a11y and components run on [chromium, firefox, webkit]:
#       * Chromium is the primary engine. Failures BLOCK the run.
#       * Firefox and WebKit are advisory (continue-on-error).
#       * The playwright configs detect PLAYWRIGHT_BROWSER and skip
#         Mobile/Tablet projects for Firefox (Firefox doesn't support
#         isMobile: true; Chromium and WebKit do).
#   - visual runs Chromium-only, inside the pinned Playwright container.
#     Baselines are pixel-exact for that image, so anyone can reproduce the
#     gate with `npm run test:visual:linux`; on the bare runner the same
#     suite failed 20/47 on font rendering alone. Firefox/WebKit have no
#     baselines and would diff on every screenshot, so we don't try.
#   - package runs once and blocks release-shape regressions: theme/evals,
#     agent CLI/skill checks, package exports, CLI copy smoke, and npm pack dry-run.

jobs:
  lint:
    name: Lint (CSS + JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  package:
    name: Package smoke (exports + CLI + pack)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright Chromium
        id: package-playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        if: steps.package-playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps (cache hit)
        if: steps.package-playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:theme

      - run: npm run test:evals

      - run: npm run test:detector

      - run: npm run agent:check

      - run: npm run test:exports

      - run: npm run smoke:cli-copy

      - run: npm run smoke:installed

      - run: npm run check:budgets

      - run: npm run test:budgets

      - run: npm run audit:runtime

      - run: npm run audit:full

      - run: npm run check:release

      - run: npm run check:supply-chain

      - run: npm run test:release-policy

  a11y:
    name: a11y (axe-core, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (${{ matrix.browser }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - run: npm run test:a11y
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-a11y-${{ matrix.browser }}
          path: playwright-report
          retention-days: 14

  components:
    name: Components (per-component scoped a11y + render, ${{ matrix.browser }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 1/1
          - browser: firefox
            shard: 1/1
          - browser: webkit
            shard: 1/2
          - browser: webkit
            shard: 2/2
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (${{ matrix.browser }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - run: npm run test:components -- --shard=${{ matrix.shard }}
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-components-${{ matrix.browser }}-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 14

  visual:
    name: Visual regression (chromium)
    runs-on: ubuntu-latest
    needs: lint
    # Baselines are pixel-exact for ONE rendering environment. Captured on the
    # bare runner they were unreproducible anywhere else — the same suite in
    # the official Playwright image failed 20/47 on font rendering alone. The
    # container makes the gate reproducible on any machine with Docker via
    # `npm run test:visual:linux`. Keep this tag in sync with the installed
    # @playwright/test version; check:performance fails if it drifts.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v6

      - run: npm ci

      # Browsers and system deps ship in the image, so no install/cache step.
      - name: Run visual suite (chromium Desktop Light)
        run: npm run test:visual:linux

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-chromium
          path: |
            playwright-report
            test-results
          retention-days: 14
