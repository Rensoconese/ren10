<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="../../../components/composites/ren-carousel/ren-carousel.js"></script>
  <style>
    .ren-carousel-viewport { display: flex; width: 300px; overflow: hidden; }

      <div class="ren-carousel-slide">Three</div>
    </div>
  </ren-carousel>

</html>
