<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detector fixture</title>
    <style>
      .fixture-shell {
        display: flex;
        color: #ff0000;
        background: var(--blue-500);
        font-size: 15px;
        line-height: 1.1;
        border-radius: 7px;
        overflow: hidden;
      }

      .fixture-tooltip {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <main class="fixture-shell">
      <h1>Heading one</h1>
      <h3>Skipped heading</h3>
      <img src="placeholder.png" alt="Placeholder">
      <button class="ren-btn">Submit</button>
      <span class="fixture-tooltip" role="tooltip">Clipped tooltip</span>
    </main>
  </body>
</html>
